<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PO Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('dashboard') }}">&#128230; PO Tracker</a>
    <div class="nav-links">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="{{ url_for('po_upload_page') }}">New PO</a>
      <a href="{{ url_for('po_list') }}">All POs</a>
      <a href="{{ url_for('invoice_upload_page') }}">New Invoice</a>
      <a href="{{ url_for('invoice_list') }}">Invoices</a>
      <div class="dropdown">
        <a href="#">Reports &#9660;</a>
        <div class="dropdown-menu">
          <a href="{{ url_for('report_pending') }}">Pending Dispatch</a>
          <a href="{{ url_for('report_completed') }}">Completed POs</a>
          <a href="{{ url_for('report_overdue') }}">Overdue POs</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
